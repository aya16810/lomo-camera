<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOMO Cam</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly; /* 上中下均勻分佈，填滿高螢幕 */
      padding: 10px 0;
    }

    #debug-log {
      font-size: 12px;
      color: #666;
      height: 16px;
      line-height: 16px;
      text-align: center;
    }

    /* 觀景窗：強制吃滿螢幕寬度 92%，不再被任何 px 限制縮小 */
    .camera-container {
      position: relative;
      width: 92vw;
      aspect-ratio: 3/4;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      cursor: pointer;
    }
    #webcam {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0; pointer-events: none;
    }
    #render-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    #shutter-flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.08s ease;
    }

    /* 控制面板：寬度與觀景窗 100% 同寬 */
    .controls {
      width: 92vw;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .preset-bar {
      display: flex; justify-content: space-between; gap: 8px;
    }
    .preset-btn {
      flex: 1; padding: 10px 0; background: #1c1c1e; border: 1px solid #333;
      border-radius: 8px; color: #aaa; font-size: 13px; cursor: pointer;
    }
    .preset-btn.active {
      background: #ff5533; border-color: #ff5533; color: #fff; font-weight: bold;
    }

    .toggles-bar {
      display: flex; gap: 8px; justify-content: space-between;
    }
    .toggle-btn {
      flex: 1; padding: 9px 0; font-size: 13px; border-radius: 20px;
      border: 1px solid #333; background: #1c1c1e; color: #777;
      cursor: pointer; transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #ff8800; border-color: #ff8800; color: #000; font-weight: bold;
    }
    .dice-btn {
      padding: 9px 14px; font-size: 13px; border-radius: 20px;
      border: 1px solid #444; background: #2a2a2c; color: #eee;
      cursor: pointer;
    }

    .slider-group {
      display: flex; align-items: center; justify-content: space-between;
    }
    .slider-group label { width: 60px; font-size: 13px; color: #888; }
    input[type=range] { flex-grow: 1; margin: 0 10px; accent-color: #ff5533; height: 6px; }

    /* 快門按鈕放大 */
    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #snap-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: #ff4444;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 68, 68, 0.4);
      transition: transform 0.08s ease;
    }
    #snap-btn:active { transform: scale(0.9); }
  </style>
</head>
