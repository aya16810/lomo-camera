<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOMO Cam</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0; padding: 0; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      height: 100vh; height: 100dvh;
      overflow: hidden; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #debug-log {
      font-size: 11px; color: #666; height: 18px; line-height: 18px;
      margin-top: 4px; text-align: center; transition: opacity 0.5s;
    }

    /* 觀景窗：自適應長螢幕與高解析度螢幕 */
    .camera-container {
      position: relative;
      width: 92vw;
      max-width: 440px;
      aspect-ratio: 3/4;
      max-height: 58vh;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0,0,0,0.8);
      cursor: pointer;
    }
    #webcam {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0; pointer-events: none;
    }
    #render-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    #shutter-flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.08s ease;
    }

    /* 控制面板區 */
    .controls {
      width: 92vw;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 6px;
    }
    .preset-bar {
      display: flex; justify-content: space-between; gap: 6px;
    }
    .preset-btn {
      flex: 1; padding: 7px 0; background: #1c1c1e; border: 1px solid #333;
      border-radius: 8px; color: #aaa; font-size: 12px; cursor: pointer;
    }
    .preset-btn.active {
      background: #ff5533; border-color: #ff5533; color: #fff; font-weight: bold;
    }

    .toggles-bar {
      display: flex; gap: 6px; justify-content: space-between;
    }
    .toggle-btn {
      flex: 1; padding: 6px 0; font-size: 11px; border-radius: 20px;
      border: 1px solid #333; background: #1c1c1e; color: #666;
      cursor: pointer; transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #ff8800; border-color: #ff8800; color: #000; font-weight: bold;
    }
    .dice-btn {
      padding: 6px 10px; font-size: 11px; border-radius: 20px;
      border: 1px solid #444; background: #2a2a2c; color: #eee;
      cursor: pointer;
    }

    .slider-group {
      display: flex; align-items: center; justify-content: space-between;
    }
    .slider-group label { width: 52px; font-size: 11px; color: #777; }
    input[type=range] { flex-grow: 1; margin: 0 8px; accent-color: #ff5533; height: 4px; }

    /* 底部快門欄位 */
    .bottom-bar {
      width: 100%; display: flex; justify-content: center; align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 16px);
      margin-bottom: 8px;
    }
    #snap-btn {
      width: 68px; height: 68px; border-radius: 50%;
      border: 4px solid #fff; background: #ff4444; cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 68, 68, 0.35);
      transition: transform 0.08s ease;
    }
    #snap-btn:active { transform: scale(0.9); }
  </style>
</head>
<body>

  <div id="debug-log">準備就緒</div>

  <!-- 點擊觀景窗也可觸發拍照 -->
  <div class="camera-container" id="viewfinder">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="render-canvas"></canvas>
    <div id="shutter-flash"></div>
  </div>

  <div class="controls">
    <div class="preset-bar">
      <button class="preset-btn active" data-filter="classic">經典</button>
      <button class="preset-btn" data-filter="cross">冷調沖印</button>
      <button class="preset-btn" data-filter="warm">暖調底片</button>
      <button class="preset-btn" data-filter="noir">硬調黑白</button>
    </div>

    <div class="toggles-bar">
      <button id="stampToggle" class="toggle-btn active">📅 日期戳：ON</button>
      <button id="leakToggle" class="toggle-btn active">✨ 漏光：ON</button>
      <button id="diceBtn" class="dice-btn">🎲 換樣式</button>
    </div>

    <div class="slider-group">
      <label>漏光強度</label>
      <input type="range" id="leakIntensitySlider" min="0" max="1" step="0.02" value="0.75">
    </div>
    <div class="slider-group">
      <label>暗角強度</label>
      <input type="range" id="vignetteSlider" min="0" max="1" step="0.02" value="0.65">
    </div>
    <div class="slider-group">
      <label>底片噪點</label>
      <input type="range" id="noiseSlider" min="0" max="60" step="1" value="22">
    </div>
  </div>

  <div class="bottom-bar">
    <button id="snap-btn"></button>
  </div>

  <script>
    const logEl = document.getElementById('debug-log');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('render-canvas');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('shutter-flash');
    const viewfinder = document.getElementById('viewfinder');
    const vignetteSlider = document.getElementById('vignetteSlider');
    const noiseSlider = document.getElementById('noiseSlider');
    const leakIntensitySlider = document.getElementById('leakIntensitySlider');
    const stampToggle = document.getElementById('stampToggle');
    const leakToggle = document.getElementById('leakToggle');
    const diceBtn = document.getElementById('diceBtn');
    const snapBtn = document.getElementById('snap-btn');
    const presetBtns = document.querySelectorAll('.preset-btn');

    let currentPreset = 'classic';
    const filters = {
      classic: 'contrast(135%) saturate(140%)',
      cross: 'contrast(125%) hue-rotate(15deg) saturate(115%) brightness(105%)',
      warm: 'sepia(35%) contrast(125%) saturate(135%) brightness(95%)',
      noir: 'grayscale(100%) contrast(165%) brightness(90%)'
    };

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPreset = btn.dataset.filter;
      });
    });

    let isDateStampOn = true;
    let isLeakOn = true;

    stampToggle.addEventListener('click', () => {
      isDateStampOn = !isDateStampOn;
      stampToggle.classList.toggle('active', isDateStampOn);
      stampToggle.innerText = isDateStampOn ? "📅 日期戳：ON" : "📅 日期戳：OFF";
    });

    leakToggle.addEventListener('click', () => {
      isLeakOn = !isLeakOn;
      leakToggle.classList.toggle('active', isLeakOn);
      leakToggle.innerText = isLeakOn ? "✨ 漏光：ON" : "✨ 漏光：OFF";
    });

    let currentLeakConfig = generateRandomLeak();

    function generateRandomLeak() {
      const posType = Math.floor(Math.random() * 3);
      let relX = 0, relY = 0;
      if (posType === 0) {
        relX = 0;
        relY = 0.2 + Math.random() * 0.6;
      } else if (posType === 1) {
        relX = 1;
        relY = 0.2 + Math.random() * 0.6;
      } else {
        relX = 0.2 + Math.random() * 0.6;
        relY = 0;
      }

      const colorType = Math.floor(Math.random() * 3);
      let rgb1, rgb2;
      if (colorType === 0) {
        rgb1 = [255, 50, 0];
        rgb2 = [255, 140, 0];
      } else if (colorType === 1) {
        rgb1 = [255, 0, 110];
        rgb2 = [180, 0, 255];
      } else {
        rgb1 = [255, 170, 0];
        rgb2 = [255, 80, 0];
      }

      return { relX, relY, radiusScale: 0.65 + Math.random() * 0.3, rgb1, rgb2 };
    }

    diceBtn.addEventListener('click', () => {
      currentLeakConfig = generateRandomLeak();
    });

    // 機械快門聲
    let audioCtx = null;
    function playShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    const noiseCanvas = document.createElement('canvas');
    const noiseCtx = noiseCanvas.getContext('2d');
    noiseCanvas.width = 128;
    noiseCanvas.height = 128;

    function updateNoiseTexture(intensity) {
      if (intensity <= 0) return;
      const imgData = noiseCtx.createImageData(128, 128);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const val = Math.random() * 255;
        data[i] = val;
        data[i + 1] = val;
        data[i + 2] = val;
        data[i + 3] = intensity;
      }
      noiseCtx.putImageData(imgData, 0, 0);
    }

    function getStampDate() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `'${yy} ${mm} ${dd}`;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        video.onplaying = () => {
          logEl.innerText = "";
          logEl.style.opacity = '0'; // 就緒後淡出日誌
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          drawFrame();
        };
      } catch (err) {
        logEl.style.opacity = '1';
        logEl.innerText = "相機啟動失敗: " + err.message;
      }
    }

    function drawFrame() {
      if (video.videoWidth === 0) {
        requestAnimationFrame(drawFrame);
        return;
      }

      const w = canvas.width;
      const h = canvas.height;

      // 1. 濾鏡畫面
      ctx.filter = filters[currentPreset];
      ctx.drawImage(video, 0, 0, w, h);
      ctx.filter = 'none';

      // 2. 漏光
      const leakIntensity = parseFloat(leakIntensitySlider.value);
      if (isLeakOn && leakIntensity > 0) {
        const { relX, relY, radiusScale, rgb1, rgb2 } = currentLeakConfig;
        const x = w * relX;
        const y = h * relY;
        const r = Math.max(w, h) * radiusScale;

        const leakGrad = ctx.createRadialGradient(x, y, 10, x, y, r);
        leakGrad.addColorStop(0, `rgba(${rgb1[0]}, ${rgb1[1]}, ${rgb1[2]}, ${0.55 * leakIntensity})`);
        leakGrad.addColorStop(0.45, `rgba(${rgb2[0]}, ${rgb2[1]}, ${rgb2[2]}, ${0.28 * leakIntensity})`);
        leakGrad.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = leakGrad;
        ctx.fillRect(0, 0, w, h);
      }

      // 3. 暗角
      const vVal = parseFloat(vignetteSlider.value);
      if (vVal > 0) {
        const radius = Math.max(w, h) / 1.35;
        const grad = ctx.createRadialGradient(w / 2, h / 2, radius * (1 - vVal * 0.7), w / 2, h / 2, radius);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, `rgba(0,0,0,${vVal * 0.95})`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      // 4. 噪點
      const nVal = parseInt(noiseSlider.value);
      if (nVal > 0) {
        updateNoiseTexture(nVal);
        ctx.fillStyle = ctx.createPattern(noiseCanvas, 'repeat');
        ctx.fillRect(0, 0, w, h);
      }

      // 5. 日期戳
      if (isDateStampOn) {
        const fontSize = Math.floor(w * 0.042);
        ctx.font = `bold ${fontSize}px "Courier New", Courier, monospace`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        
        ctx.shadowColor = 'rgba(255, 60, 0, 0.9)';
        ctx.shadowBlur = 6;
        ctx.fillStyle = '#ff8800';
        ctx.fillText(getStampDate(), w - (w * 0.05), h - (h * 0.04));
        ctx.shadowBlur = 0;
      }

      requestAnimationFrame(drawFrame);
    }

    // 拍照執行
    function takePhoto() {
      playShutterSound();
      flashEl.style.opacity = '0.85';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 80);

      const link = document.createElement('a');
      link.download = `LOMO_${Date.now()}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    }

    // 快門按鈕與點擊觀景窗拍照
    snapBtn.addEventListener('click', takePhoto);
    viewfinder.addEventListener('click', takePhoto);

    startCamera();
  </script>
</body>
</html>
