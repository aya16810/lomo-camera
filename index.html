<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LOMO Cam (穩定版)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #121212;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; color: #fff; font-family: sans-serif;
    }
    #debug-log {
      font-size: 11px; color: #aaa; margin-bottom: 8px; text-align: center; max-width: 90vw;
    }
    .camera-container {
      position: relative; width: 85vw; max-width: 380px; aspect-ratio: 3/4;
      background: #000; border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    /* 讓 video 留在畫面上但透明，確保瀏覽器持續解碼 */
    #webcam {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0; pointer-events: none;
    }
    #render-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    .controls {
      margin-top: 16px; width: 85vw; max-width: 380px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .slider-group {
      display: flex; align-items: center; justify-content: space-between;
    }
    .slider-group label { width: 45px; font-size: 14px; color: #bbb; }
    input[type=range] { flex-grow: 1; margin: 0 10px; accent-color: #ff4444; }
    
    #snap-btn {
      margin-top: 18px; width: 66px; height: 66px; border-radius: 50%;
      border: 4px solid #fff; background: #ff4444; cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 68, 68, 0.4);
      transition: transform 0.1s ease;
    }
    #snap-btn:active { transform: scale(0.92); }
  </style>
</head>
<body>

  <div id="debug-log">正在啟動相機...</div>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="render-canvas"></canvas>
  </div>

  <div class="controls">
    <div class="slider-group">
      <label for="vignetteSlider">暗角</label>
      <input type="range" id="vignetteSlider" min="0" max="1" step="0.02" value="0.7">
    </div>
    <div class="slider-group">
      <label for="noiseSlider">噪點</label>
      <input type="range" id="noiseSlider" min="0" max="60" step="1" value="25">
    </div>
  </div>

  <button id="snap-btn"></button>

  <script>
    const logEl = document.getElementById('debug-log');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('render-canvas');
    const ctx = canvas.getContext('2d');
    const vignetteSlider = document.getElementById('vignetteSlider');
    const noiseSlider = document.getElementById('noiseSlider');
    const snapBtn = document.getElementById('snap-btn');

    function log(msg) {
      logEl.innerText = msg;
      console.log(msg);
    }

    // 建立微型噪點畫布（快取機制，避免每一幀都手算幾萬個像素）
    const noiseCanvas = document.createElement('canvas');
    const noiseCtx = noiseCanvas.getContext('2d');
    noiseCanvas.width = 128;
    noiseCanvas.height = 128;

    function updateNoiseTexture(intensity) {
      if (intensity <= 0) return;
      const imgData = noiseCtx.createImageData(128, 128);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const val = Math.random() * 255;
        data[i] = val;
        data[i + 1] = val;
        data[i + 2] = val;
        data[i + 3] = intensity; // 透明度即為噪點強度
      }
      noiseCtx.putImageData(imgData, 0, 0);
    }

    async function startCamera() {
      try {
        log("請求鏡頭權限中...");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        
        video.srcObject = stream;
        log("鏡頭連線成功，等待影像解碼...");

        // 監聽真正開始播放
        video.onplaying = () => {
          log("相機運作中");
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          drawFrame();
        };

      } catch (err) {
        log("錯誤: " + err.name + " (" + err.message + ")");
        alert("相機開啟失敗: " + err.name + "\n" + err.message);
      }
    }

    function drawFrame() {
      if (video.videoWidth === 0) {
        requestAnimationFrame(drawFrame);
        return;
      }

      const w = canvas.width;
      const h = canvas.height;

      // 1. 繪製並增強對比/飽和 (LOMO 色調)
      ctx.filter = 'contrast(130%) saturate(140%)';
      ctx.drawImage(video, 0, 0, w, h);
      ctx.filter = 'none';

      // 2. 疊加暗角
      const vVal = parseFloat(vignetteSlider.value);
      if (vVal > 0) {
        const radius = Math.max(w, h) / 1.3;
        const grad = ctx.createRadialGradient(w / 2, h / 2, radius * (1 - vVal * 0.7), w / 2, h / 2, radius);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, `rgba(0,0,0,${vVal * 0.95})`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      // 3. 疊加噪點
      const nVal = parseInt(noiseSlider.value);
      if (nVal > 0) {
        // 隨機跳動紋理偏移量，產生底片動態噪點
        updateNoiseTexture(nVal);
        ctx.fillStyle = ctx.createPattern(noiseCanvas, 'repeat');
        ctx.fillRect(0, 0, w, h);
      }

      requestAnimationFrame(drawFrame);
    }

    // 拍照存檔
    snapBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `lomo_${Date.now()}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });

    startCamera();
  </script>
</body>
</html>
