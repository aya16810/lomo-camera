<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LOMO Web Cam</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .camera-box {
      position: relative;
      width: 100vw;
      max-width: 400px;
      aspect-ratio: 3/4;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* CSS 實現基礎 LOMO：高對比 + 高飽和 */
      filter: contrast(135%) saturate(145%);
    }
    /* 覆蓋暗角層 */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
    }
    button {
      margin-top: 20px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: #ff4444;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="camera-box">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="vignette"></div>
  </div>

  <button id="snap-btn"></button>
  <canvas id="output-canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const snapBtn = document.getElementById('snap-btn');

    // 1. 啟用手機後置鏡頭
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("無法讀取相機: " + err.message);
      }
    }

    // 2. 拍照並合成濾鏡
    snapBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      // 繪製視訊影像（套用色彩濾鏡）
      ctx.filter = 'contrast(135%) saturate(145%)';
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 疊加暗角
      const radius = Math.max(canvas.width, canvas.height) / 1.4;
      const gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, radius * 0.3,
        canvas.width / 2, canvas.height / 2, radius
      );
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(1, 'rgba(0,0,0,0.75)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 下載照片
      const link = document.createElement('a');
      link.download = `lomo_${Date.now()}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });

    startCamera();
  </script>
</body>
</html>
